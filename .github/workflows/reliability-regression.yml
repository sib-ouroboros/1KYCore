name: Reliability regression

on:
  push:
    branches: [cleanup/remove-bots, main, 'development/**']
    paths:
      - src/tools/vmap4_extractor/model.cpp
      - src/tools/vmap4_extractor/adtfile.cpp
      - contrib/tests/test_vmap_model_names.py
      - src/server/scripts/EasternKingdoms/Gilneas/**
      - contrib/tests/test_gilneas_quests.py
      - src/server/game/Globals/ObjectMgr.*
      - src/server/scripts/World/PetBattleTrainer.cpp
      - contrib/tests/test_garrison_reward_reload.py
      - src/server/scripts/Pandaria/SiegeOfOrgrimmar/boss_malkorok.cpp
      - contrib/tests/test_malkorok_barrier.py
      - src/server/scripts/Pandaria/SiegeOfOrgrimmar/boss_korkron_dark_shaman.cpp
      - src/server/game/Entities/GameObject/GameObjectData.h
      - src/server/game/Loot/Loot.cpp
      - docs/audit-data/campaign-source-loot-restoration.json
      - contrib/tests/test_source_loot_contract.py
      - src/server/game/AI/CoreAI/UnitAI.*
      - src/common/Utilities/Duration.h
      - contrib/tests/test_ai_delay_units.py
      - src/server/scripts/Pandaria/StormstoutBrewery/instance_stormstout_brewery.cpp
      - src/server/scripts/Pandaria/StormstoutBrewery/stormstout_brewery.h
      - contrib/tests/test_stormstout_brew_event.py
      - contrib/tests/test_dark_shaman_target.py
      - src/server/scripts/EasternKingdoms/Zones/zone_eastern_kingdoms_elwynn_forest.cpp
      - contrib/tests/test_hogger_scene.py
      - src/common/Utilities/EventProcessor.*
      - src/server/game/Entities/Unit/Unit.*
      - src/server/scripts/Argus/AntorusTheBurningThrone/boss_aggramar.cpp
      - contrib/tests/test_magni_teleport.py
      - contrib/tests/test_aggramar_spawns.py
      - src/server/scripts/Spells/spell_monk.cpp
      - contrib/tests/test_monk_mastery_guard.py
      - src/server/game/Server/OnlineMgr.*
      - src/server/game/Server/WorldSession.cpp
      - src/server/game/Server/ToolSocket.*
      - src/common/Utilities/MessageBuffer.h
      - src/server/game/Server/Json/**
      - src/server/game/Entities/Player/PlayerCharacterSetup.*
      - src/server/game/Entities/Player/Player.cpp
      - src/server/game/Entities/Player/Player.h
      - cmake/genrev.cmake
      - revision_data.h.in.cmake
      - contrib/tests/test_character_operations.py
      - contrib/tests/test_tool_socket.py
      - contrib/tests/test_character_setup_inventory.py
      - contrib/tests/test_revision_metadata.py
      - .github/workflows/reliability-regression.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real CMake revision generation
        run: python contrib/tests/test_revision_metadata.py
      - name: Test tool protocol with address and undefined behavior sanitizers
        run: python contrib/tests/test_tool_socket.py
      - name: Test inventory lifetime and bag handling with sanitizers
        run: python contrib/tests/test_character_setup_inventory.py
      - name: Test specialization, uninterrupted preparation, status and pagination
        run: python contrib/tests/test_character_operations.py
      - name: Test reward reload and trainer fallback with strict sanitizers
        run: python contrib/tests/test_garrison_reward_reload.py
      - name: Test Malkorok barrier boundaries with strict sanitizers
        run: python contrib/tests/test_malkorok_barrier.py
      - name: Test monk mastery spell mapping and unknown spell fallback
        run: python contrib/tests/test_monk_mastery_guard.py
      - name: Test Gilneas quest combat and story transition with strict sanitizers
        run: python contrib/tests/test_gilneas_quests.py
      - name: Test extractor model names and long paths with strict sanitizers
        run: python contrib/tests/test_vmap_model_names.py
      - name: Test dark shaman target selection and fallback with strict sanitizers
        run: python contrib/tests/test_dark_shaman_target.py
      - name: Test Hogger scene actors and escape destinations with strict sanitizers
        run: python contrib/tests/test_hogger_scene.py
      - name: Test Magni delayed teleport and player-owned event cancellation
        run: python contrib/tests/test_magni_teleport.py
      - name: Test Aggramar spawn array bounds and exact phase actors
        run: python contrib/tests/test_aggramar_spawns.py
      - name: Test actual AI delayed-event duration conversion
        run: python contrib/tests/test_ai_delay_units.py
      - name: Test Stormstout brew event and owner lifetime
        run: python contrib/tests/test_stormstout_brew_event.py
      - name: Test native source loot keys and quest-item eligibility
        run: python contrib/tests/test_source_loot_contract.py
