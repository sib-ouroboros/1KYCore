name: Reliability regression

on:
  push:
    branches: [cleanup/remove-bots, main, 'development/**']
    paths:
      - src/server/game/Movement/CombatSlot.*
      - src/server/game/Movement/MovementGenerators/TargetedMovementGenerator.*
      - src/server/game/Entities/Object/ObjectPosSelector.*
      - contrib/tests/test_npc_combat_slots.py
      - contrib/tests/fixtures/crowd_test_*
      - contrib/tests/test_gameobject_visuals.py
      - src/server/game/Entities/GameObject/GameObject.*
      - src/server/game/Entities/GameObject/GameObjectData.h
      - src/server/game/Globals/ObjectMgr.cpp
      - contrib/tests/test_false_orders_credit.py
      - src/server/scripts/World/conversation_scripts.cpp
      - contrib/tests/test_campaign_nearest_actors.py
      - docs/audit-data/campaign-nearest-conversation-restoration.json
      - src/server/game/Movement/PathGenerator.*
      - contrib/tests/test_elevated_surface_pathing.py
      - src/tools/vmap4_extractor/model.cpp
      - src/tools/vmap4_extractor/adtfile.cpp
      - contrib/tests/test_vmap_model_names.py
      - src/server/scripts/EasternKingdoms/Gilneas/**
      - contrib/tests/test_gilneas_quests.py
      - contrib/tests/test_gilneas_scene.py
      - src/server/scripts/BrokenIsles/DemonHunterZones/zone_mardum.cpp
      - contrib/tests/test_mardum_invasion.py
      - src/server/game/Globals/ObjectMgr.*
      - src/server/scripts/World/PetBattleTrainer.cpp
      - contrib/tests/test_garrison_reward_reload.py
      - src/server/scripts/Pandaria/SiegeOfOrgrimmar/boss_malkorok.cpp
      - contrib/tests/test_malkorok_barrier.py
      - src/server/scripts/Pandaria/SiegeOfOrgrimmar/boss_korkron_dark_shaman.cpp
      - src/server/game/Entities/GameObject/GameObjectData.h
      - src/server/game/Loot/Loot.cpp
      - docs/audit-data/campaign-source-loot-restoration.json
      - contrib/tests/test_source_loot_contract.py
      - src/server/database/Database/MySQLConnection.cpp
      - contrib/tests/test_mysql_prepare_logging.py
      - src/server/game/Loot/LootMgr.cpp
      - docs/audit-data/campaign-wildcard-loot-restoration.json
      - contrib/tests/test_wildcard_loot_modes.py
      - contrib/tests/test_diagnostic_formats.py
      - src/common/Utilities/WowTime.cpp
      - contrib/tests/test_wowtime_holiday_arithmetic.py
      - src/server/game/Spells/Spell.cpp
      - src/server/game/Miscellaneous/SharedDefines.h
      - contrib/tests/test_spell_lock_keys.py
      - src/server/game/Scripting/ScriptReloadMgr.cpp
      - contrib/tests/test_script_cache_path.py
      - src/server/game/ChallengeMode/ChallengeModeMgr.cpp
      - src/server/game/Globals/BattlePetDataStore.cpp
      - src/server/game/Handlers/QuestHandler.cpp
      - src/server/game/Server/CustomTalkMenu.cpp
      - src/server/game/Instances/InstanceScript.cpp
      - src/server/game/AI/CoreAI/UnitAI.*
      - src/common/Utilities/Duration.h
      - contrib/tests/test_ai_delay_units.py
      - src/server/scripts/Pandaria/StormstoutBrewery/instance_stormstout_brewery.cpp
      - src/server/scripts/Pandaria/StormstoutBrewery/stormstout_brewery.h
      - contrib/tests/test_stormstout_brew_event.py
      - contrib/tests/test_dark_shaman_target.py
      - src/server/scripts/EasternKingdoms/Zones/zone_eastern_kingdoms_elwynn_forest.cpp
      - contrib/tests/test_hogger_scene.py
      - src/common/Utilities/EventProcessor.*
      - src/server/game/Entities/Unit/Unit.*
      - src/server/scripts/Argus/AntorusTheBurningThrone/boss_aggramar.cpp
      - contrib/tests/test_magni_teleport.py
      - contrib/tests/test_aggramar_spawns.py
      - src/server/scripts/Spells/spell_monk.cpp
      - contrib/tests/test_monk_mastery_guard.py
      - src/server/game/Server/OnlineMgr.*
      - src/server/game/Server/WorldSession.cpp
      - src/server/game/Server/ToolSocket.*
      - src/common/Utilities/MessageBuffer.h
      - src/server/game/Server/Json/**
      - contrib/tests/test_json_array_delimiters.py
      - contrib/tests/test_conversation_packet_layout.py
      - src/server/game/Entities/Conversation/Conversation.h
      - src/server/game/Globals/ConversationDataStore.h
      - docs/audit-data/campaign-simple-conversation-restoration.json
      - docs/audit-data/campaign-conversation-chain-restoration.json
      - contrib/tests/test_blackhand_blaze_owner.py
      - src/server/scripts/Draenor/BlackrockFoundry/boss_blackhand.cpp
      - src/server/scripts/Draenor/BlackrockFoundry/boss_blackhand.h
      - contrib/tests/test_twin_peaks_flag_return.py
      - src/server/game/Battlegrounds/Zones/BattlegroundTP.cpp
      - src/server/game/Entities/Player/PlayerCharacterSetup.*
      - src/server/game/Entities/Player/Player.cpp
      - src/server/game/Entities/Player/Player.h
      - cmake/genrev.cmake
      - revision_data.h.in.cmake
      - contrib/tests/test_character_operations.py
      - contrib/tests/test_tool_socket.py
      - contrib/tests/test_character_setup_inventory.py
      - contrib/tests/test_revision_metadata.py
      - .github/workflows/reliability-regression.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native NPC combat slots and chase with sanitizers
        run: python contrib/tests/test_npc_combat_slots.py
      - name: Test elevated creature paths with address and undefined behavior sanitizers
        run: python contrib/tests/test_elevated_surface_pathing.py
      - name: Test native GO visual loading and state transitions
        run: python contrib/tests/test_gameobject_visuals.py
      - name: Test native False Orders quest credit
        run: python contrib/tests/test_false_orders_credit.py
      - name: Test source-compatible nearest conversation actors
        run: python contrib/tests/test_campaign_nearest_actors.py
      - name: Test real CMake revision generation
        run: python contrib/tests/test_revision_metadata.py
      - name: Test tool protocol with address and undefined behavior sanitizers
        run: python contrib/tests/test_tool_socket.py
      - name: Test inventory lifetime and bag handling with sanitizers
        run: python contrib/tests/test_character_setup_inventory.py
      - name: Test specialization, uninterrupted preparation, status and pagination
        run: python contrib/tests/test_character_operations.py
      - name: Test reward reload and trainer fallback with strict sanitizers
        run: python contrib/tests/test_garrison_reward_reload.py
      - name: Test Malkorok barrier boundaries with strict sanitizers
        run: python contrib/tests/test_malkorok_barrier.py
      - name: Test monk mastery spell mapping and unknown spell fallback
        run: python contrib/tests/test_monk_mastery_guard.py
      - name: Test Gilneas quest combat and story transition with strict sanitizers
        run: python contrib/tests/test_gilneas_quests.py
      - name: Test Avery scene ordering and scoped Lorna impact with strict sanitizers
        run: python contrib/tests/test_gilneas_scene.py
      - name: Test Mardum personal departure and phase lifecycle with strict sanitizers
        run: python contrib/tests/test_mardum_invasion.py
      - name: Test extractor model names and long paths with strict sanitizers
        run: python contrib/tests/test_vmap_model_names.py
      - name: Test dark shaman target selection and fallback with strict sanitizers
        run: python contrib/tests/test_dark_shaman_target.py
      - name: Test Hogger scene actors and escape destinations with strict sanitizers
        run: python contrib/tests/test_hogger_scene.py
      - name: Test Magni delayed teleport and player-owned event cancellation
        run: python contrib/tests/test_magni_teleport.py
      - name: Test Aggramar spawn array bounds and exact phase actors
        run: python contrib/tests/test_aggramar_spawns.py
      - name: Test actual AI delayed-event duration conversion
        run: python contrib/tests/test_ai_delay_units.py
      - name: Test Stormstout brew event and owner lifetime
        run: python contrib/tests/test_stormstout_brew_event.py
      - name: Test native source loot keys and quest-item eligibility
        run: python contrib/tests/test_source_loot_contract.py
      - name: Test MySQL prepare logging with bounded string views
        run: python contrib/tests/test_mysql_prepare_logging.py
      - name: Test actual native grouped and ordinary wildcard loot modes
        run: python contrib/tests/test_wildcard_loot_modes.py
      - name: Test full diagnostic sizes and GUIDs with strict format checks
        run: python contrib/tests/test_diagnostic_formats.py
      - name: Test holiday minute arithmetic with strict shift and overflow checks
        run: python contrib/tests/test_wowtime_holiday_arithmetic.py
      - name: Test actual item, skill and spell lock validation
        run: python contrib/tests/test_spell_lock_keys.py
      - name: Test dynamic cache path for branch names with separators
        run: python contrib/tests/test_script_cache_path.py
      - name: Test navigation option precedence and legacy configuration compatibility
        run: python contrib/tests/test_navigation_config.py
      - name: Test Twin Peaks dropped flag return without duplicating the opposing flag
        run: python contrib/tests/test_twin_peaks_flag_return.py
      - name: Test Blackhand blaze controller identity and periodic caster lifetime
        run: python contrib/tests/test_blackhand_blaze_owner.py
      - name: Test original conversation packets against actual native packed structures
        run: python contrib/tests/test_conversation_packet_layout.py
      - name: Test bundled JSON array separator parsing with sanitizers
        run: python contrib/tests/test_json_array_delimiters.py
