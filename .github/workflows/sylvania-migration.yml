name: Sylvania release migration

on:
  push:
    branches: [cleanup/remove-bots, 'development/**']
    paths:
      - sql/updates/**
      - contrib/tests/**
      - .github/workflows/sylvania-migration.yml
  pull_request:
    paths:
      - sql/updates/**
      - contrib/tests/**
      - .github/workflows/sylvania-migration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL (${{ matrix.suite.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - {name: full, args: ''}
          - {name: source-actor-conversations, args: '--source-actor-conversations-only'}
          - {name: brew-delivery, args: '--brew-delivery-only'}
          - {name: campaign-scenes, args: '--campaign-scenes-only'}
          - {name: campaign-rogue-objects, args: '--campaign-rogue-objects-only'}
          - {name: gilneas-chain, args: '--gilneas-chain-only'}
          - {name: required-level-objects, args: '--required-level-only'}
          - {name: native-visuals, args: '--native-visuals-only'}
          - {name: conversation-chains, args: '--conversation-chains-only'}
          - {name: simple-conversations, args: '--simple-conversations-only'}
          - {name: council-books, args: '--council-books-only'}
          - {name: native-goobers, args: '--native-goobers-only'}
          - {name: wildcard-loot, args: '--wildcard-loot-only'}
          - {name: source-loot, args: '--source-loot-only'}
          - {name: smart-wall, args: '--smart-wall-only'}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Test real release, conflict guards and interruption recovery
        env:
          MYSQL_PWD: disposable-test-only
          MYSQL_DISPOSABLE_TEST_SERVER: '1'
        run: python contrib/tests/test_sylvania_migration.py ${{ matrix.suite.args }}
